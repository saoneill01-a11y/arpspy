# XcodeGen project description. Run `xcodegen` in this folder to create ArpSpy.xcodeproj.
name: ArpSpy
options:
  bundleIdPrefix: com.arpradar
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
targets:
  ArpSpy:
    type: application
    platform: macOS
    sources:
      - path: ArpSpy
    info:
      path: ArpSpy/Info.plist
      properties:
        CFBundleDisplayName: ARPradar
        CFBundleName: ARPradar
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 Sean O'Neill. Free software under the GNU GPL v3.
        # The About box, exported files and crash logs show the version from MARKETING_VERSION below.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: ARPradar uses Bluetooth only to talk to an ARPradar Sensor you pick in Tools › ARPradar Sensor.
        NSLocalNetworkUsageDescription: ARPradar needs Local Network access to find devices on your network.
        # macOS shows Wi-Fi network names only to apps allowed to use Location.
        NSLocationUsageDescription: ARPradar shows Wi-Fi network names in Wi-Fi Signal and Wi-Fi Analyzer. macOS only shares network names with apps allowed to use Location. ARPradar never reads your location.
        NSLocationWhenInUseUsageDescription: ARPradar shows Wi-Fi network names in Wi-Fi Signal and Wi-Fi Analyzer. macOS only shares network names with apps allowed to use Location. ARPradar never reads your location.
        # Reading web pages and UPnP files on devices means plain http:// to IP addresses.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arpradar.mac
        # The app file is ARPradar.app; the code module stays ArpSpy so tests and saved data are unchanged.
        PRODUCT_NAME: ARPradar
        PRODUCT_MODULE_NAME: ArpSpy
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 5
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: ArpSpy/ArpSpy.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Apple's hardened runtime (needed for notarization) in Release builds only: Debug keeps it off so the unit
        # tests can load into the app.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  # ARPradar for iPhone: runs scans on an ARPradar Sensor (Raspberry Pi) over Bluetooth. Shares the sensor code with
  # the Mac app. Build with the ARPradarSensor scheme.
  ARPradarSensor:
    type: application
    platform: iOS
    sources:
      - path: iPhone
      - ArpSpy/Sensor/SensorLink.swift
      - ArpSpy/Model/IPv4.swift
      - ArpSpy/Model/NetworkText.swift
      - ArpSpy/Scan/OUIDatabase.swift
      - ArpSpy/Scan/Ports.swift
      - ArpSpy/Heatmap/HeatmapCore.swift
      - path: ArpSpy/Resources/oui.csv
        buildPhase: resources
    info:
      path: iPhone/Info.plist
      properties:
        CFBundleDisplayName: ARPradar
        CFBundleName: ARPradar
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: © 2026 Sean O'Neill. Free software under the GNU GPL v3.
        NSBluetoothAlwaysUsageDescription: ARPradar uses Bluetooth to talk to your ARPradar Sensor, which runs the network scans.
        NSCameraUsageDescription: ARPradar uses the camera and LiDAR to draw floor plans and to know where you are while you walk a Wi-Fi heatmap.
        NSLocationWhenInUseUsageDescription: ARPradar uses your location only while you walk an outdoor Wi-Fi heatmap, to place each measurement on the map.
        UIRequiredDeviceCapabilities: [arm64]
        CFBundleDocumentTypes:
          - CFBundleTypeName: ARPradar Heatmap
            LSHandlerRank: Owner
            LSItemContentTypes: [com.arpradar.heatmap]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.arpradar.heatmap
            UTTypeDescription: ARPradar Heatmap
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [arpheatmap]
        LSSupportsOpeningDocumentsInPlace: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The only encryption is Apple's own (CryptoKit) protecting the Bluetooth link to the sensor.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arpradar.sensor
        PRODUCT_NAME: ARPradar
        PRODUCT_MODULE_NAME: ARPradarSensor
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  ArpSpyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ArpSpyTests
    dependencies:
      - target: ArpSpy
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ARPradar.app/Contents/MacOS/ARPradar"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  ArpSpy:
    build:
      targets:
        ArpSpy: all
        ArpSpyTests: [test]
    test:
      targets:
        - ArpSpyTests
  ARPradarSensor:
    build:
      targets:
        ARPradarSensor: all
